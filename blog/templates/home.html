{% extends 'base.html' %}
{% block content %}
    <h2>Все посты</h2>
    {% for post in posts %}
        <div class="post">
            <h3><a href="{% url 'post_detail' post.id %}">{{ post.title }}</a></h3>
            <p>Автор: {{ post.author.username }} | {{ post.created_at }}</p>
        </div>
    {% endfor %}
{% endblock %}
